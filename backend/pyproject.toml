[project]
name = "backend"
version = "0.1.0"
description = "Supply Guard AI Backend"
authors = [
    { name = "anas ahmed shaikh", email = "anasahmedshaikh.work@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "openai>=1.10.0",
    "openai-agents>=0.6.4",
]

[tool.fastapi]
entrypoint= "backend.main:app"

[project.scripts]
dev = "backend:development"
prod = "backend:production"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
